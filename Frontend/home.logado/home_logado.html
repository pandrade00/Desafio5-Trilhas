
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnóstix</title>
    <link rel="stylesheet" href="home_logado.css" />
  </head>
  <body>
    <!-- Cabeçalho -->
    <header class="cabecalho">
      <div class="logo">
        <div class="logo-icon">
          <img src="../assets/lupa-branca.png" alt="lupa" />
        </div>
        <div class="logo-text">
          <h1><span>D</span>iagn<span>ó</span>stix</h1>
          <p>Entender para cuidar</p>
        </div>
      </div>
      <nav class="menu">
        <a href="../home/home.html">Home</a>
        <a href="../faq/faq.html">Fale Conosco</a>
        <a href="../login/login.html">Login</a>
      </nav>
    </header>

    <!-- Corpo da Página -->
    <section class="corpo">
      <!-- Título -->
      <div class="box-titulo">
        <h2>Olá, Ana Lúcia!</h2>
      </div>

      <!-- Cards principais -->
      <div class="cards">
        <div class="card">
          <img src="../assets/lupa-azul.png" alt="Buscar UBS" />
          <h3>Buscar UBS</h3>
          <p>Encontre sua Unidade Básica de Saúde</p>
        </div>
        <div class="card">
          <img src="../assets/calendario.png" alt="Consultas" />
          <h3>Consultas</h3>
          <p>Agende ou monitore sua consulta agora mesmo</p>
        </div>
        <div class="card">
          <img src="../assets/injecao.png" alt="Campanhas de Saúde" />
          <h3>Dados Saúde</h3>
          <p>Entre informações sobre a saúde no MA</p>
        </div>
      </div>

      <div class="card-banner">
        <img src="../assets/diagnostix.png" alt="Banner Diagnóstix" class="banner-img" />
      </div>
    </section>
  </body>
</html>
