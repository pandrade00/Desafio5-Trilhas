<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumo do Agendamento</title>
  <link href="../css/exame-resumo.css" rel="stylesheet" />
</head>

<body>
  <header class="cabecalho">
    <div class="logo">
      <div class="logo-icon">
        <img src="../assets/lupa-branca.png" alt="lupa" />
      </div>
      <div class="logo-text">
        <h1>Diagnóstix</h1>
        <p>Entender para cuidar</p>
      </div>
    </div>
    <nav class="menu">
      <a href="../public/index.html">Home</a>
      <a href="../public/faq.html">Fale Conosco</a>
      <a href="../public/login.html">Login</a>
    </nav>
  </header>

  <main class="container">
    <h1>Agendar Exame</h1>

    <div class="icone-alerta">
      <div class="circulo-amarelo"></div>
      <img src="../assets/sino-de-notificacao.png" alt="Alerta" />
    </div>

    <div class="card">
      <h2>Resumo do Agendamento:</h2>

      <div class="info">
        <p><strong>Exame:</strong> </p>
        <p><strong>Unidade:</strong> </p>
        <p><strong>Endereço:</strong> </p>
        <p><strong>Data:</strong> </p>
        <p><strong>Horário:</strong> </p>
      </div>

      <div class="buttons">
        <button class="btn voltar">Voltar</button>
        <button class="btn confirmar">Confirmar</button>
      </div>
    </div>
  </main>
  <script src="../js/exame.resumo.js"></script>
</body>

</html>
