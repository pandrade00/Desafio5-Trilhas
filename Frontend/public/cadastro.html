<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="https://cdn.jsdelivr.net/npm/vanilla-masker@1.2.0/lib/vanilla-masker.min.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnóstix - Cadastro</title>
  <link rel="stylesheet" href="./css/cadastro.css" />
</head>

<body>
  <!-- Cabeçalho -->
  <header class="cabecalho">
    <div class="logo">
      <div class="logo-icon">
        <img src="./assets/lupa-branca.png" alt="lupa" />
      </div>
      <div class="logo-text">
        <h1>Diagnóstix</h1>
        <p>Entender para cuidar</p>
      </div>
    </div>
    <nav class="menu">
      <a href="./index.html">Home</a>
      <a href="./faq.html">Fale Conosco</a>
      <a href="./login.html">Login</a>
    </nav>
  </header>

  <!-- Corpo -->
  <section class="corpo">
    <div class="card-login">
      <h2>Cadastre-se</h2>

      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" required />

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" required />

      <label for="email">E-mail</label>
      <input type="email" id="email" required />

      <label for="celular">Celular</label>
      <input type="text" id="numero" required />

      <label for="cep">CEP</label>
      <input type="text" id="cep" required />

      <label for="senha">Senha</label>
      <input type="password" id="senha" required />

      <label>Data de Nascimento</label>
      <div class="data-nascimento">
        <select id="dia" required>
          <option value="">Dia</option>
        </select>
        <select id="mes" required>
          <option value="">Mês</option>
          <option value="01">Janeiro</option>
          <option value="02">Fevereiro</option>
          <option value="03">Março</option>
          <option value="04">Abril</option>
          <option value="05">Maio</option>
          <option value="06">Junho</option>
          <option value="07">Julho</option>
          <option value="08">Agosto</option>
          <option value="09">Setembro</option>
          <option value="10">Outubro</option>
          <option value="11">Novembro</option>
          <option value="12">Dezembro</option>
        </select>
        <select id="ano" required>
          <option value="">Ano</option>
        </select>
      </div>

      <label for="genero">Gênero</label>
      <select id="genero" required>
        <option value="">Selecione</option>
        <option value="feminino">Feminino</option>
        <option value="masculino">Masculino</option>
        <option value="outro">Outro</option>
      </select>

      <button class="btn-entrar">Cadastrar</button>

      <p class="link-menor">
        Ao cadastrar, você aceita os <a href="#">Termos de Uso</a> e a
        <a href="#">Política de Privacidade</a>.
      </p>
    </div>
  </section>
  <div class="popup-overlay" id="popupSucesso">
    <div class="popup-content">
      <h3>Cadastro finalizado!</h3>
      <p>Agora você pode acessar o Diagnóstix</p>
      <button class="popup-btn" id="btnIrParaLogin">Ir para Login</button>
    </div>
  </div>

  <script src="./js/cadastro.js"></script>
</body>

</html>
