<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendar Consulta</title>
  <link href="agendar.conf.css" rel="stylesheet" />
</head>

<body>
  <header class="cabecalho">
    <div class="logo">
      <div class="logo-icon">
        <img src="../assets/lupa-branca.png" alt="lupa" />
      </div>
      <div class="logo-text">
        <h1>Diagnóstix</h1>
        <p>Entender para cuidar</p>
      </div>
    </div>
    <nav class="menu">
      <a href="../home/home.html">Home</a>
      <a href="../faq/faq.html">Fale Conosco</a>
      <a href="../login/login.html">Login</a>
    </nav>
  </header>

  <div class="container">
    <h1>Agendar Consulta</h1>

    <div class="icone-alerta">
      <div class="circulo-amarelo"></div>
      <img src="../assets/sino-de-notificacao.png" alt="Alerta" />
    </div>

    <div class="card">
      <h2>Confirme seus dados:</h2>
      <p><strong>Nome Completo:</strong> <span id="user-name">Carregando...</span></p>
      <p><strong>Data de Nascimento:</strong> <span id="user-dob">Carregando...</span></p>
      <p><strong>CPF:</strong> <span id="user-cpf">Carregando...</span></p>
      <p><strong>Contato:</strong> <span id="user-phone">Carregando...</span></p>
      <p><strong>Email:</strong> <span id="user-email">Carregando...</span></p>

      <div class="buttons">
        <button class="btn editar">Editar</button>
        <button class="btn continuar">Continuar</button>
      </div>
    </div>
  </div>
</body>
<script src="agendar.conf.js"></script>

</html>
