<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendar Exame</title>
  <link href="exame.agendar.css" rel="stylesheet" />
</head>
<body>
  <header class="cabecalho">
      <div class="logo">
        <div class="logo-icon">
          <img src="../assets/lupa-branca.png" alt="lupa" />
        </div>
        <div class="logo-text">
          <h1>Diagnóstix</h1>
          <p>Entender para cuidar</p>
        </div>
      </div>
      <nav class="menu">
        <a href="../home/home.html">Home</a>
        <a href="../faq/faq.html">Fale Conosco</a>
        <a href="../login/login.html">Login</a>
      </nav>
    </header>

  <div class="container">
    <h1>Agendar Exame</h1>

    <div class="icone-alerta">
        <div class="circulo-amarelo"></div>
        <img src="../assets/sino-de-notificacao.png" alt="Alerta" />
      </div>

    <div class="card">
      <label for="exame">Exame:</label>
      <div class="search-box">
          <input type="text" placeholder="Digite aqui o exame que você procura" />
          <button>
            <img src="../assets/lupa-azul.png" alt="Buscar" />
          </button>
      </div>

      <div class="buttons">
        <button class="btn continuar">Continuar</button>
      </div>
    </div>
  </div>
  <script src="exame.agendar.js"></script>
</body>
</html>
