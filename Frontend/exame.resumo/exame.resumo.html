<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resumo do Agendamento</title>
  <link href="exame.resumo.css" rel="stylesheet"/>
</head>
<body>
  <header class="cabecalho">
      <div class="logo">
        <div class="logo-icon">
          <img src="../assets/lupa-branca.png" alt="lupa" />
        </div>
        <div class="logo-text">
          <h1>Diagnóstix</h1>
          <p>Entender para cuidar</p>
        </div>
      </div>
      <nav class="menu">
        <a href="../home/home.html">Home</a>
        <a href="../faq/faq.html">Fale Conosco</a>
        <a href="../login/login.html">Login</a>
      </nav>
    </header>

  <main class="container">
    <h1>Agendar Exame</h1>

    <div class="icone-alerta">
        <div class="circulo-amarelo"></div>
        <img src="../assets/sino-de-notificacao.png" alt="Alerta" />
      </div>

    <div class="card">
      <p class="label">Resumo do Agendamento:</p>

      <div class="info">
        <p><strong>Exame:</strong> Eletrocardiograma (ecg)</p>
        <p><strong>Unidade:</strong> Hospital Dr. Clementino Moura (Socorrão II)</p>
        <p><strong>Data:</strong> 26/05/2025</p>
        <p><strong>Horário:</strong> 13:00</p>
      </div>

      <div class="buttons">
        <button class="btn voltar">Voltar</button>
        <button class="btn confirmar">Confirmar</button>
      </div>
    </div>
  </main>
  <script src="exame.resumo.js"></script>
</body>
</html>
